<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB MCP 配置中心</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f8;
  --surface: #ffffff;
  --surface-2: #fbfbfc;
  --surface-3: #f2f1f4;
  --line: rgba(17, 17, 20, .055);
  --line-2: rgba(17, 17, 20, .1);
  --text: #111114;
  --text-2: #6b6b76;
  --text-3: #9d9daa;
  --accent: #f5813a;
  --accent-soft: rgba(245, 129, 58, .1);
  --green: #34b369;
  --green-soft: rgba(52, 179, 105, .1);
  --red: #e5533d;
  --red-soft: rgba(229, 83, 61, .09);
  --amber: #eaa32b;
  --shadow-card: 0 1px 2px rgba(17,17,20,.04), 0 14px 34px -18px rgba(17,17,20,.14);
  --shadow-pop: 0 1px 3px rgba(17,17,20,.05), 0 30px 70px -24px rgba(17,17,20,.28);
  --shadow-btn: 0 1px 2px rgba(17,17,20,.06);
  --ease-out: cubic-bezier(.32, .72, 0, 1);
  --spring: linear(0, .103 6.25%, .31 12.5%, .525 18.75%, .705 25%, .836 31.25%, .922 37.5%, .974 43.75%, 1.001 50%, 1.0125 56.25%, 1.0152 62.5%, 1.0136 68.75%, 1.0105 75%, 1.0072 81.25%, 1.0045 87.5%, 1.0025 93.75%, 1);
}

html { background: var(--bg); }

body {
  position: relative;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(920px 520px at 12% -8%, rgba(255, 176, 200, .26), transparent 66%),
    radial-gradient(780px 460px at 88% -12%, rgba(178, 170, 255, .2), transparent 66%),
    radial-gradient(600px 400px at 50% 0%, rgba(255, 214, 190, .14), transparent 70%);
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,20,.14); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,20,.24); background-clip: content-box; }

::selection { background: rgba(245,129,58,.18); }

.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 40px 26px 100px; }

.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-feature-settings: "tnum"; letter-spacing: -.012em; }

/* ---------------------------------------------------------------- 顶部 */

.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
.title { font-size: 38px; font-weight: 600; letter-spacing: -.038em; line-height: 1.06; color: var(--text); }
.subtitle { font-size: 13px; color: var(--text-2); margin-top: 11px; letter-spacing: -.004em; }
.header-actions { display: flex; gap: 9px; flex-shrink: 0; padding-bottom: 3px; }

.stats { display: flex; gap: 34px; margin-top: 22px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 25px; font-weight: 600; letter-spacing: -.028em; line-height: 1.1; font-feature-settings: "tnum"; }
.stat span { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: .04em; }

/* ---------------------------------------------------------------- 按钮 */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 15px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px; font-weight: 500; font-family: inherit;
  letter-spacing: -.004em; cursor: pointer; white-space: nowrap;
  box-shadow: var(--shadow-btn);
  transition: transform .16s var(--ease-out), background .16s, border-color .16s, box-shadow .16s;
  user-select: none;
}
.btn:hover { background: var(--surface-2); border-color: rgba(17,17,20,.16); }
.btn:active { transform: scale(.97); box-shadow: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: #111114; border-color: #111114; color: #fff; font-weight: 500; }
.btn.primary:hover { background: #26262c; border-color: #26262c; }
.btn.primary:active { transform: scale(.97); }
.header-actions .btn { min-width: 106px; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: rgba(17,17,20,.045); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.sm { height: 29px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
.btn.tiny { height: 27px; padding: 0 11px; font-size: 12px; border-radius: 8px; font-weight: 500; }
.btn.star { padding: 0 8px; color: var(--text-3); }
.btn.star:hover { color: #d9932b; background: rgba(232,163,61,.1); border-color: transparent; }
.btn.star.on { color: #d9932b; background: rgba(232,163,61,.16); }
.btn:disabled { opacity: .35; pointer-events: none; }

/* ------------------------------------------------------------ 环境切换 */

.envbar { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.env-pills {
  display: flex; gap: 3px; flex-wrap: wrap; flex: 1; min-width: 0;
  background: rgba(17,17,20,.042);
  padding: 4px; border-radius: 13px;
  width: fit-content;
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 15px;
  border-radius: 10px;
  color: var(--text-2);
  font-size: 13px; font-weight: 500; letter-spacing: -.004em;
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: background .2s var(--ease-out), color .2s, box-shadow .2s, transform .16s var(--ease-out);
}
.pill:hover { color: var(--text); }
.pill:active { transform: scale(.97); }
.pill.active {
  background: var(--surface); color: var(--text); font-weight: 500;
  box-shadow: 0 1px 2px rgba(17,17,20,.07), 0 0 0 .5px rgba(17,17,20,.04);
}
.pill .cnt { font-size: 11.5px; font-weight: 400; color: var(--text-3); }
.pill.active .cnt { color: var(--text-2); }

.icon-btn {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  padding: 0; color: var(--text-2);
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: background .16s, color .16s, transform .16s var(--ease-out), border-color .16s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: rgba(17,17,20,.16); }
.icon-btn:active { transform: scale(.94); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ------------------------------------------------------------ 数据源列表 */

.dslist {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 34px;
}
.ds-head {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.35fr) 96px 164px;
  gap: 16px; align-items: center;
  padding: 15px 22px 11px;
  font-size: 11px; font-weight: 600; color: var(--text-3);
  letter-spacing: .045em;
  border-bottom: 1px solid var(--line);
}
.ds-row {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1.35fr) 96px 164px;
  gap: 16px; align-items: center;
  padding: 15px 22px;
  border-bottom: 1px solid var(--line);
  transition: background .16s;
}
.ds-row:last-child { border-bottom: none; }
.ds-row:hover { background: var(--surface-2); }
.ds-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ds-alias { font-size: 13.5px; font-weight: 600; color: var(--text); letter-spacing: -.014em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-cell { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-actions { display: flex; gap: 6px; justify-content: flex-end; }

.status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: var(--green); box-shadow: 0 0 0 3px rgba(52,179,105,.12); }
.dot.fail { background: var(--red); box-shadow: 0 0 0 3px rgba(229,83,61,.1); }
.dot.unknown { background: #cfcfd6; }
.dot.testing { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

.badge { font-size: 10.5px; font-weight: 600; padding: 2.5px 7px; border-radius: 6px; letter-spacing: .01em; white-space: nowrap; flex-shrink: 0; }
.badge.ro { background: var(--red-soft); color: var(--red); }
.badge.rw { background: var(--green-soft); color: #1f8a4d; }
.badge.drv { background: rgba(17,17,20,.05); color: var(--text-2); font-weight: 500; }

/* -------------------------------------------------------------- 区块 */

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 15px; }
.section-title { font-size: 19px; font-weight: 600; letter-spacing: -.024em; line-height: 1.2; }
.section-desc { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }

.plist { display: flex; flex-direction: column; }
.prow {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.prow:last-child { border-bottom: none; }
.prow-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-width: 0; }
.prow-name { font-size: 15px; font-weight: 600; letter-spacing: -.016em; flex-shrink: 0; }
.prow-aliases { font-size: 12px; color: var(--text-3); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-actions { display: flex; gap: 6px; flex-shrink: 0; }
.binds { display: flex; gap: 6px; flex-wrap: wrap; }
.bind {
  font-size: 12px; padding: 4px 10px; border-radius: 8px;
  background: rgba(17,17,20,.04);
  color: var(--text-2);
  transition: background .16s;
}
.bind.on { background: var(--accent-soft); color: #b4581d; }
.bind.def { box-shadow: inset 0 0 0 1px rgba(245,129,58,.35); }
.bind.off { background: transparent; box-shadow: inset 0 0 0 1px rgba(17,17,20,.1); color: var(--text-3); }
.bind .k { color: var(--text-3); margin-right: 5px; }
.bind.on .k { color: rgba(180,88,29,.7); }
.dflt { font-size: 10px; font-weight: 600; margin-left: 5px; color: #b4581d; }
.scope { font-size: 10.5px; font-weight: 600; padding: 2.5px 8px; border-radius: 6px; background: rgba(17,17,20,.05); color: var(--text-3); white-space: nowrap; flex-shrink: 0; }
.scope.auto { background: var(--accent-soft); color: #b4581d; }

.empty {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 56px 20px; text-align: center;
  color: var(--text-3); font-size: 13.5px;
}
.empty button { margin-top: 16px; }

/* -------------------------------------------------------------- 弹窗 */

.mask {
  position: fixed; inset: 0;
  background: rgba(17,17,20,.22);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 60px 20px 40px;
  overflow-y: auto;
  animation: mask-in .3s var(--ease-out);
}
@keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  position: relative;
  width: 100%; max-width: 552px;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow-pop);
  animation: modal-in .46s var(--spring);
  will-change: transform, opacity;
}
.modal.wide { max-width: 636px; }
@keyframes modal-in { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
.modal-head { padding: 24px 26px 18px; }
.modal-title { font-size: 21px; font-weight: 600; letter-spacing: -.026em; }
.modal-sub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
.modal-body { padding: 0 26px 24px; }
.modal-foot { padding: 16px 26px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 9px; }

.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; margin-bottom: 16px; min-width: 0; }
.label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 7px; letter-spacing: .005em; }
.label .opt { font-weight: 400; color: var(--text-3); margin-left: 5px; }

input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%; height: 38px;
  background: rgba(17,17,20,.04);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0 13px;
  color: var(--text);
  font-size: 13.5px; font-family: inherit; letter-spacing: -.004em;
  transition: background .16s, border-color .16s, box-shadow .16s;
}
input::placeholder { color: var(--text-3); }
input:hover, select:hover { background: rgba(17,17,20,.055); }
input:focus, select:focus, textarea:focus {
  outline: none;
  background: var(--surface);
  border-color: rgba(17,17,20,.18);
  box-shadow: 0 0 0 4px rgba(17,17,20,.05);
}
select {
  cursor: pointer; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}

.chips {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 6px 8px; min-height: 42px;
  background: rgba(17,17,20,.04);
  border: 1px solid transparent;
  border-radius: 10px; cursor: text;
  transition: background .16s, border-color .16s, box-shadow .16s;
}
.chips:focus-within {
  background: var(--surface);
  border-color: rgba(17,17,20,.18);
  box-shadow: 0 0 0 4px rgba(17,17,20,.05);
}
.chips input {
  flex: 1; min-width: 90px; height: 26px;
  border: none; background: transparent; box-shadow: none !important;
  padding: 0 4px; font-size: 13.5px;
}
.chips input:hover, .chips input:focus { background: transparent; border-color: transparent; box-shadow: none !important; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line-2);
  padding: 2px 6px 2px 9px; border-radius: 7px;
  font-size: 12.5px; font-weight: 500;
  box-shadow: 0 1px 1px rgba(17,17,20,.03);
  animation: chip-in .34s var(--spring);
}
@keyframes chip-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
.chip .x { cursor: pointer; opacity: .4; font-size: 14px; line-height: 1; transition: opacity .16s, color .16s; }
.chip .x:hover { opacity: 1; color: var(--red); }

.divider { height: 1px; background: var(--line); margin: 22px 0; }
.group-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
.group-label b { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .005em; }
.group-label span { font-size: 11.5px; color: var(--text-3); }

.bind-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bind-row:last-child { margin-bottom: 0; }
.bind-row .bk { width: 74px; flex-shrink: 0; font-size: 12.5px; font-weight: 500; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bind-row select { flex: 1; height: 34px; font-size: 13px; padding: 0 12px; padding-right: 30px; background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px; }

.env-row { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.env-row:last-of-type { border-bottom: none; }
.env-key { font-size: 11px; color: var(--text-3); width: 60px; flex-shrink: 0; }
.env-row input[type=text] { flex: 1; height: 32px; font-size: 13px; padding: 0 11px; }
.env-row .ro-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.env-row input[type=checkbox], label input[type=checkbox] { accent-color: #111114; cursor: pointer; width: 15px; height: 15px; }

/* -------------------------------------------------------------- toast */

.toast-root { position: fixed; bottom: 26px; right: 26px; z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: flex-end; }
.toast {
  display: flex; align-items: center; gap: 9px;
  background: rgba(17,17,20,.94);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  color: #fff;
  padding: 12px 17px; border-radius: 12px;
  font-size: 13px; font-weight: 500; letter-spacing: -.004em;
  box-shadow: 0 16px 40px -12px rgba(17,17,20,.4);
  animation: toast-in .44s var(--spring);
  max-width: 350px;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.95); } to { opacity: 1; transform: none; } }
.toast.ok::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
.toast.err::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ff7a68; flex-shrink: 0; }

.warn-box {
  background: var(--red-soft);
  color: var(--red);
  padding: 13px 15px; border-radius: 12px;
  font-size: 12.5px; line-height: 1.55; margin-bottom: 16px;
  animation: chip-in .34s var(--spring);
}
.hint { font-size: 11.5px; color: var(--text-3); margin-top: 7px; line-height: 1.45; }

/* ------------------------------------------------------ 左右两栏面板 */

.panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 18px;
  align-items: stretch;
  margin-bottom: 34px;
}

.panel {
  display: flex;
  flex-direction: column;
  min-height: 340px;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 14px; padding: 16px 22px 12px;
}
.panel-title { font-size: 19px; font-weight: 600; letter-spacing: -.024em; line-height: 1.2; }
.panel-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.panel-desc { font-size: 12.5px; color: var(--text-2); margin-top: 5px; line-height: 1.45; }

.panel-tabs {
  display: flex; align-items: flex-end;
  gap: 24px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
}
.panel-tab {
  position: relative;
  display: flex; align-items: flex-end; gap: 6px;
  padding: 0 0 12px;
  font-size: 13px; font-weight: 500;
  color: var(--text-2);
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: color .16s;
}
.panel-tab:hover { color: var(--text); }
.panel-tab.active { color: var(--text); font-weight: 600; }
.panel-tab.active::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; border-radius: 1px;
  background: var(--text);
}
.panel-tab .cnt { font-size: 11.5px; font-weight: 400; color: var(--text-3); }
.panel-tab.active .cnt { color: var(--text-2); }

.panel-body {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 4px 22px 18px;
  min-height: 0;
}

.filter-panel {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height .34s var(--ease-out), opacity .22s var(--ease-out);
}
.filter-panel.open { max-height: 460px; opacity: 1; overflow-y: auto; }
.filter-panel-inner { padding: 2px 22px 12px; }
.filter-list { display: flex; flex-direction: column; gap: 1px; }

.filter-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-radius: 8px;
  font-size: 12.5px; color: var(--text-2);
  cursor: pointer; white-space: nowrap; user-select: none;
  transition: background .14s, color .14s;
}
.filter-item:hover { background: rgba(17,17,20,.04); color: var(--text); }
.filter-item:active { transform: scale(.99); }
.filter-item.active { color: var(--text); font-weight: 500; background: rgba(17,17,20,.05); }
.filter-item .check { margin-left: auto; opacity: 0; color: var(--text); flex-shrink: 0; transition: opacity .16s; }
.filter-item.active .check { opacity: 1; }

.filter-panel.open .filter-item {
  animation: item-in .36s var(--ease-out) both;
  animation-delay: var(--d, 0ms);
}
@keyframes item-in {
  from { opacity: 0; transform: translateY(-7px); }
  to { opacity: 1; transform: none; }
}

.filter-empty { padding: 32px 0; text-align: center; font-size: 12.5px; color: var(--text-3); }

.icon-btn.is-filtered { background: #111114; border-color: #111114; color: #fff; }
.icon-btn.is-open { background: var(--surface-2); border-color: rgba(17,17,20,.16); }

.panel-empty {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 30px 0 26px;
  text-align: center;
}
.empty-icon { color: #d6d6de; margin-bottom: 15px; }
.empty-text { font-size: 13px; color: var(--text-3); margin-bottom: 17px; }

.spacer { flex: 1; }

.ds-items { display: flex; flex-direction: column; }
.ds-item { padding: 13px 0; border-bottom: 1px solid var(--line); }
.ds-item:last-child { border-bottom: none; }
.ds-item-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ds-item-sub {
  font-size: 11.5px; color: var(--text-3);
  margin-top: 5px; padding-left: 15px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* -------------------------------------------------------- 执行记录 */

.log-section {
  margin-top: 44px;
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.log-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 17px; }
.log-title { font-size: 19px; font-weight: 600; letter-spacing: -.024em; }
.log-sub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
.log-actions { display: flex; gap: 7px; flex-shrink: 0; }
.log-empty { padding: 52px 24px; text-align: center; color: var(--text-3); font-size: 13px; }

.log-body { display: grid; grid-template-columns: minmax(0, 1fr) 228px; border-top: 1px solid var(--line); }
.log-main { min-width: 0; }
.log-side { border-left: 1px solid var(--line); padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 24px; }

.log-row {
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) minmax(0, 1.9fr) 60px 14px;
  gap: 12px; align-items: center;
  padding: 10px 24px;
  font-size: 12.5px;
}
.log-headrow {
  font-size: 10.5px; font-weight: 600; color: var(--text-3);
  letter-spacing: .05em; padding-top: 11px; padding-bottom: 10px;
  background: var(--surface-2);
}
.log-item { border-bottom: 1px solid var(--line); transition: background .14s; }
.log-item:last-child { border-bottom: none; }
.log-item:hover { background: var(--surface-2); }
.log-time { color: var(--text-3); font-size: 11.5px; }
.log-src { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.log-src .via { flex-shrink: 0; padding: 1px 5px; border-radius: 4px; background: rgba(17,17,20,.06); color: var(--text-3); font-size: 10px; font-weight: 500; }
.log-sql { color: var(--text); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-ms { color: var(--text-3); font-size: 11.5px; text-align: right; }
.log-flag { width: 6px; height: 6px; border-radius: 50%; justify-self: end; }
.log-flag.ok { background: var(--green); }
.log-flag.fail { background: var(--red); }
.log-err { padding: 0 24px 10px 90px; margin-top: -4px; font-size: 11.5px; color: var(--red); line-height: 1.45; }

.log-pager {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 24px 13px;
  border-top: 1px solid var(--line);
}
.pager-info { font-size: 12px; color: var(--text-3); font-feature-settings: "tnum"; }
.pager-btns { display: flex; gap: 7px; }

.side-title { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .05em; margin-bottom: 13px; }
.side-stats { display: flex; flex-direction: column; gap: 11px; }
.lg-stat { display: flex; align-items: baseline; gap: 9px; }
.lg-stat b { font-size: 20px; font-weight: 600; letter-spacing: -.024em; font-feature-settings: "tnum"; min-width: 36px; }
.lg-stat span { font-size: 11.5px; color: var(--text-3); }
.top-list { display: flex; flex-direction: column; gap: 9px; }
.top-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.top-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-item b { font-weight: 600; color: var(--text); font-size: 12.5px; font-feature-settings: "tnum"; }

/* ------------------------------------------------------------ 响应式 */

@media (max-width: 900px) {
  .panels { grid-template-columns: 1fr; gap: 14px; }
  .panel { min-height: 0; }
  .ds-head { display: none; }
  .ds-row {
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    padding: 16px 18px;
  }
  .ds-name { grid-column: 1; }
  .ds-actions { grid-column: 2; grid-row: 1; }
  .ds-cell, .ds-row .status { grid-column: 1 / -1; }

  .log-body { grid-template-columns: 1fr; }
  .log-side { border-left: none; border-top: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; gap: 26px; }
  .side-block { flex: 1; min-width: 170px; }
}

@media (max-width: 640px) {
  .wrap { padding: 28px 16px 70px; }
  .title { font-size: 29px; letter-spacing: -.03em; }
  .header { flex-direction: column; align-items: stretch; }
  .header-actions { padding-bottom: 0; }
  .stats { gap: 26px; }
  .field-row { flex-direction: column; gap: 0; }
  .toast-root { left: 16px; right: 16px; align-items: stretch; }
  .toast { max-width: none; }

  .log-headrow { display: none; }
  .log-row { grid-template-columns: 52px minmax(0, 1fr) 52px 12px; gap: 8px; padding: 11px 16px; }
  .log-src { display: none; }
  .log-err { padding-left: 68px; padding-right: 16px; }
  .log-head { padding: 18px 16px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

@media (prefers-contrast: more) {
  :root { --line: rgba(17,17,20,.16); --line-2: rgba(17,17,20,.3); --text-2: #46464e; --text-3: #6b6b76; }
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<div class="toast-root" id="toast-root"></div>

<script>
let CFG = null;
let CURRENT_ENV = null;
let PROJ_FILTER = 'all';
let filterOpen = false;
let editAliases = [];
let lastPointer = { x: 0, y: 0, valid: false };
const STATUS = {};

document.addEventListener('pointerdown', e => {
  lastPointer = { x: e.clientX, y: e.clientY, valid: true };
}, true);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && (data.detail || data.error)) || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

async function send(method, path, body) {
  try {
    const payload = body ? { ...body, version: CFG.version } : undefined;
    CFG = await api(method, path, payload);
    return true;
  } catch (e) {
    if (e.status === 409) {
      await loadConfig();
      toast('配置已被其他窗口修改，已刷新', false);
      return false;
    }
    toast(e.message, false);
    return false;
  }
}

async function drop(path) {
  try {
    CFG = await api('DELETE', path + '?version=' + CFG.version);
    return true;
  } catch (e) {
    if (e.status === 409) { await loadConfig(); toast('配置已被其他窗口修改，已刷新', false); return false; }
    toast(e.message, false);
    return false;
  }
}

async function loadConfig() {
  CFG = await api('GET', '/api/config');
  if (!CURRENT_ENV || !CFG.environments.some(e => e.key === CURRENT_ENV)) {
    CURRENT_ENV = CFG.environments.length ? sortedEnvs()[0].key : null;
  }
  render();
}

const sortedEnvs = () => [...CFG.environments].sort((a, b) => a.order - b.order);
const dsOf = env => CFG.datasources.filter(d => d.env === env);
const envLabel = k => {
  const e = CFG.environments.find(x => x.key === k);
  return e ? e.label : k;
};
const dsById = id => CFG.datasources.find(d => d.id === id);
const statusOf = id => STATUS[id] || 'unknown';
const statusText = s => ({ ok: '连接正常', fail: '连接失败', unknown: '未测试', testing: '测试中' }[s] || '未测试');

function effectiveDefaultEnv(p) {
  const keys = Object.keys(p.bindings || {}).filter(k => p.bindings[k]);
  if (keys.length === 1) return keys[0];
  if (p.defaultEnv && p.bindings[p.defaultEnv]) return p.defaultEnv;
  return null;
}

/* 项目过滤：all / env:<key> / incomplete */
function projectMatches(p) {
  if (PROJ_FILTER === 'all') return true;
  if (PROJ_FILTER === 'incomplete') {
    return sortedEnvs().some(e => !(p.bindings || {})[e.key]);
  }
  if (PROJ_FILTER.startsWith('env:')) {
    return !!(p.bindings || {})[PROJ_FILTER.slice(4)];
  }
  return true;
}

function toggleFilter(e) {
  if (e) e.stopPropagation();
  filterOpen = !filterOpen;
  const panel = $('filter-panel');
  const btn = $('filter-btn');
  if (panel) panel.classList.toggle('open', filterOpen);
  if (btn) btn.classList.toggle('is-open', filterOpen);
}

function setFilter(v) {
  if (PROJ_FILTER === v) v = 'all';
  PROJ_FILTER = v;
  filterOpen = false;
  render();
}

document.addEventListener('click', () => {
  if (!filterOpen) return;
  filterOpen = false;
  const panel = $('filter-panel');
  const btn = $('filter-btn');
  if (panel) panel.classList.remove('open');
  if (btn) btn.classList.remove('is-open');
});

function filterChipsHTML() {
  let i = 0;
  const item = (v, label) => {
    const delay = (i++) * 45;
    return `
      <div class="filter-item ${PROJ_FILTER === v ? 'active' : ''}" style="--d:${delay}ms"
           onclick="setFilter('${v}');event.stopPropagation()">
        <span>${esc(label)}</span>
        <svg class="check" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2 6.2l2.6 2.6L10 3.4" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
  };

  return `
    <div class="filter-panel ${filterOpen ? 'open' : ''}" id="filter-panel"
         onclick="event.stopPropagation()">
      <div class="filter-panel-inner">
        <div class="filter-list">
          ${item('all', '全部项目')}
          ${sortedEnvs().map(e => item('env:' + e.key, '绑定了「' + e.label + '」')).join('')}
          ${item('incomplete', '存在未绑定的环境')}
        </div>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ 渲染 */

function render() {
  if (!CFG) {
    $('app').innerHTML = '<div class="empty">正在加载配置…</div>';
    return;
  }
  const list = sortedEnvs();
  const rows = CURRENT_ENV ? dsOf(CURRENT_ENV) : [];
  const projShown = CFG.projects.filter(projectMatches);

  $('app').innerHTML = `
    <div class="header">
      <div>
        <div class="title">DB-MCP</div>
        <div class="stats">
          <div class="stat"><b>${list.length}</b><span>环境</span></div>
          <div class="stat"><b>${CFG.datasources.length}</b><span>数据源</span></div>
          <div class="stat"><b>${CFG.projects.length}</b><span>项目</span></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="testAll()">测试全部</button>
        <button class="btn primary" onclick="openDsModal()">新增数据源</button>
      </div>
    </div>

    <div class="panels">

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">数据源</div>
          <button class="icon-btn" onclick="openEnvModal()" title="管理环境" aria-label="管理环境">
            <svg width="16" height="16" viewBox="0 0 17 17" fill="none" aria-hidden="true">
              <path d="M8.5 3.4v10.2M3.4 8.5h10.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="panel-tabs">
          ${list.map(e => `
            <div class="panel-tab ${e.key === CURRENT_ENV ? 'active' : ''}" onclick="switchEnv('${e.key}')">
              ${esc(e.label)}<span class="cnt">${dsOf(e.key).length}</span>
            </div>
          `).join('')}
        </div>

        <div class="panel-body">
          ${rows.length === 0 ? `
            <div class="panel-empty">
              <svg class="empty-icon" width="46" height="46" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5.7" rx="7.3" ry="2.9"/>
                <path d="M4.7 5.7v6.1c0 1.6 3.27 2.9 7.3 2.9s7.3-1.3 7.3-2.9V5.7"/>
                <path d="M4.7 11.8v6.1c0 1.6 3.27 2.9 7.3 2.9s7.3-1.3 7.3-2.9v-6.1"/>
              </svg>
              <div class="empty-text">这个环境下还没有数据源</div>
              <button class="btn primary sm" onclick="openDsModal()">新增一个</button>
            </div>`
            : `<div class="ds-items">${rows.map(dsRowHTML).join('')}</div>`}
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">项目映射</div>
            <div class="panel-desc">AI 按项目名或别名解析数据源，未绑定的环境会明确报错而不是降级</div>
          </div>
          <div class="panel-actions">
            <button class="icon-btn" onclick="openProjModal()" title="新增项目" aria-label="新增项目">
              <svg width="16" height="16" viewBox="0 0 17 17" fill="none" aria-hidden="true">
                <path d="M8.5 3.4v10.2M3.4 8.5h10.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="icon-btn ${PROJ_FILTER !== 'all' ? 'is-filtered' : ''}" id="filter-btn"
                    onclick="toggleFilter(event)" title="过滤" aria-label="过滤">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.4"/>
                <path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5L3.4 3.4"
                      stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        ${filterChipsHTML()}

        <div class="panel-body">
          ${CFG.projects.length === 0 ? `
            <div class="panel-empty">
              <svg class="empty-icon" width="46" height="46" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.7" y="3.7" width="14.6" height="16.6" rx="2.6"/>
                <path d="M8.7 9h6.6M8.7 12.6h6.6M8.7 16.2h3.8"/>
              </svg>
              <div class="empty-text">还没有配置项目映射</div>
              <button class="btn sm" onclick="openProjModal()">新增项目</button>
            </div>` : `
            <div id="proj-list">${projShown.length
              ? projShown.map(projHTML).join('')
              : '<div class="filter-empty">没有匹配的项目</div>'}</div>`}
        </div>
      </section>

    </div>

    <section class="log-section" id="log-panel">
      <div class="log-empty">正在读取执行记录…</div>
    </section>
  `;

  renderLogs();
}

let logBusy = false;
let LOG_PAGE = 1;
const LOG_SIZE = 20;

async function renderLogs(page) {
  if (typeof page === 'number' && page > 0) LOG_PAGE = page;
  const panel = $('log-panel');
  if (!panel || logBusy) return;
  logBusy = true;
  try {
    const data = await api('GET', `/api/logs?page=${LOG_PAGE}&size=${LOG_SIZE}`);
    LOG_PAGE = data.page || 1;
    const p = $('log-panel');
    if (!p) return;
    p.innerHTML = logHTML(data);
  } catch (e) {
    const p = $('log-panel');
    if (p) p.innerHTML = `<div class="log-empty">读取执行记录失败：${esc(e.message)}</div>`;
  } finally {
    logBusy = false;
  }
}

function logHTML(d) {
  const items = d.items || [];
  const stats = d.stats || {};
  const head = `
    <div class="log-head">
      <div>
        <div class="log-title">执行记录</div>
        <div class="log-sub">AI 每次查询与写入都会留痕，含失败的调用</div>
      </div>
      <div class="log-actions">
        <button class="btn sm" onclick="renderLogs()">刷新</button>
        <button class="btn sm danger" onclick="askClearLogs()">清空</button>
      </div>
    </div>`;

  if (!items || !items.length) {
    return head + `<div class="log-empty">${d.total > 0
      ? '这一页没有记录了'
      : '还没有执行记录。等 AI 查一次库，或者用 CLI 跑一条查询。'}</div>` + pagerHTML(d);
  }

  const rows = items.map(it => {
    const t = String(it.ts || '').slice(11) || '--:--:--';
    const src = [it.project, it.datasource].filter(Boolean).join(' · ') || '未指定';
    const via = it.resolvedBy || '';
    const srcFull = via ? `${src}　← 由 ${via} 选出` : src;
    const ms = it.ms == null ? '—' : it.ms + 'ms';
    const flag = it.ok ? 'ok' : 'fail';
    const sql = String(it.sql || '');
    return `
      <div class="log-item">
        <div class="log-row">
          <span class="log-time mono">${esc(t)}</span>
          <span class="log-src" title="${esc(srcFull)}">${esc(src)}${via === '默认数据源' ? '<span class="via">默认</span>' : ''}</span>
          <span class="log-sql mono" title="${esc(sql)}">${esc(sql)}</span>
          <span class="log-ms mono">${esc(ms)}</span>
          <span class="log-flag ${flag}" title="${it.ok ? '成功' : '失败'}"></span>
        </div>
        ${it.ok ? '' : `<div class="log-err">${esc(it.error || '执行失败')}</div>`}
      </div>
    `;
  }).join('');

  const st = stats || {};
  const tops = (st.topProjects || []).map(x => `
    <div class="top-item"><span>${esc(x.name)}</span><b>${x.count}</b></div>
  `).join('') || '<div class="top-item"><span>暂无</span><b>0</b></div>';

  return `
    ${head}
    <div class="log-body">
      <div class="log-main">
        <div class="log-row log-headrow">
          <span>时间</span><span>来源</span><span>SQL</span><span>耗时</span><span></span>
        </div>
        <div class="log-rows">${rows}</div>
        ${pagerHTML(d)}
      </div>
      <aside class="log-side">
        <div class="side-block">
          <div class="side-title">最近 ${st.total || 0} 次</div>
          <div class="side-stats">
            <div class="lg-stat"><b>${st.ok || 0}</b><span>成功</span></div>
            <div class="lg-stat"><b>${st.fail || 0}</b><span>失败</span></div>
            <div class="lg-stat"><b>${st.avgMs || 0}</b><span>平均 ms</span></div>
          </div>
        </div>
        <div class="side-block">
          <div class="side-title">最活跃</div>
          <div class="top-list">${tops}</div>
        </div>
      </aside>
    </div>
  `;
}

function pagerHTML(d) {
  if (!d.total) return '';
  const page = d.page || 1;
  const pages = d.pages || 1;
  return `
    <div class="log-pager">
      <span class="pager-info">共 ${d.total} 条 · 第 ${page} / ${pages} 页</span>
      <div class="pager-btns">
        <button class="btn tiny" onclick="renderLogs(${page - 1})" ${page <= 1 ? 'disabled' : ''}>上一页</button>
        <button class="btn tiny" onclick="renderLogs(${page + 1})" ${page >= pages ? 'disabled' : ''}>下一页</button>
      </div>
    </div>
  `;
}

function askClearLogs() {
  showModal(`
    <div class="modal-head"><div class="modal-title">清空执行记录</div></div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-2);line-height:1.6">会删除 <code class="mono">query_log.jsonl</code> 中的全部记录，不可恢复。数据源配置不受影响。</p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn danger" onclick="doClearLogs()">确认清空</button>
    </div>
  `);
}

async function doClearLogs() {
  try {
    await api('DELETE', '/api/logs');
    closeModal();
    LOG_PAGE = 1;
    await renderLogs(1);
    toast('执行记录已清空');
  } catch (e) {
    toast(e.message, false);
  }
}

setInterval(() => {
  if (!document.hidden && !$('modal-root').innerHTML) renderLogs();
}, 5000);

function dsRowHTML(d) {
  const st = statusOf(d.id);
  const drv = d.driver && d.driver !== 'mysql' ? `<span class="badge drv">${esc(d.driver)}</span>` : '';
  const sub = `${d.host}:${d.port} · ${d.database || '不限定库'}`;
  const title = (d.user ? `${d.user}@` : '') + sub;
  const isDef = !!(CFG.global && CFG.global.defaultDatasource === d.id);
  return `
    <div class="ds-item">
      <div class="ds-item-top">
        <span class="dot ${st}" title="${statusText(st)}"></span>
        <span class="ds-alias mono">${esc(d.alias)}</span>
        <span class="badge ${d.readonly ? 'ro' : 'rw'}">${d.readonly ? '只读' : '可写'}</span>
        ${drv}
        <span class="spacer"></span>
        <button class="btn tiny star ${isDef ? 'on' : ''}" onclick="setDefaultDs('${d.id}')"
                title="${isDef ? '取消默认数据源' : '设为默认数据源'}" aria-label="设为默认">
          <svg width="12" height="12" viewBox="0 0 12 12"
               fill="${isDef ? 'currentColor' : 'none'}" stroke="currentColor"
               stroke-width="1.2" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 1.5l1.4 2.85 3.15.46-2.28 2.22.54 3.13L6 8.68l-2.81 1.48.54-3.13L1.45 4.81 4.6 4.35z"/>
          </svg>
        </button>
        <button class="btn tiny" onclick="testDs('${d.id}')">测试</button>
        <button class="btn tiny" onclick="openDsModal('${d.id}')">编辑</button>
        <button class="btn tiny danger" onclick="askDeleteDs('${d.id}')">删除</button>
      </div>
      <div class="ds-item-sub mono" title="${esc(title)}">${esc(sub)}</div>
    </div>
  `;
}

async function setDefaultDs(id) {
  const cur = CFG.global && CFG.global.defaultDatasource;
  const next = cur === id ? '' : id;
  const ok = await send('PUT', '/api/global', { defaultDatasource: next });
  if (!ok) return;
  render();
  toast(next ? '已设为默认数据源，AI 不指定项目时使用它' : '已取消默认数据源');
}

function projHTML(p) {
  const defKey = effectiveDefaultEnv(p);
  const binds = sortedEnvs().map(e => {
    const id = p.bindings[e.key];
    const ds = id ? dsById(id) : null;
    if (!ds) return `<span class="bind off"><span class="k">${esc(e.label)}</span>未绑定</span>`;
    const isDef = e.key === defKey;
    return `<span class="bind on ${isDef ? 'def' : ''}"><span class="k">${esc(e.label)}</span>${esc(ds.alias)}${isDef ? '<span class="dflt">默认</span>' : ''}</span>`;
  }).join('');
  return `
    <div class="prow">
      <div class="prow-top">
        <span class="prow-name">${esc(p.name)}</span>
        <span class="prow-aliases" title="${esc((p.aliases || []).join('、'))}">${p.aliases && p.aliases.length ? p.aliases.map(esc).join(' · ') : '无别名'}</span>
        <span class="spacer"></span>
        <button class="btn tiny" onclick="openProjModal('${p.id}')">编辑</button>
        <button class="btn tiny danger" onclick="askDeleteProj('${p.id}')">删除</button>
      </div>
      <div class="binds">${binds}</div>
    </div>
  `;
}

/* ------------------------------------------------------------ 通用组件 */

function toast(msg, ok = true) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
  $('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function showModal(html, wide) {
  const root = $('modal-root');
  root.innerHTML = `<div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
  const modal = root.querySelector('.modal');
  if (!modal || !lastPointer.valid) return;
  const r = modal.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const nx = Math.min(Math.max((lastPointer.x - r.left) / r.width, .12), .88);
  const ny = Math.min(Math.max((lastPointer.y - r.top) / r.height, .08), .92);
  modal.style.transformOrigin = `${nx * 100}% ${ny * 100}%`;
}

function closeModal() { $('modal-root').innerHTML = ''; }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ------------------------------------------------------------ 环境切换 */

function switchEnv(key) {
  CURRENT_ENV = key;
  render();
}

/* ------------------------------------------------------------ 数据源 */

async function testDs(id, silent) {
  if (STATUS[id] === 'testing') return;
  STATUS[id] = 'testing';
  render();
  try {
    const r = await api('POST', `/api/datasources/${id}/test`);
    STATUS[id] = r.ok ? 'ok' : 'fail';
    if (!silent) {
      const d = dsById(id);
      toast(r.ok ? `${d.alias} 连接正常 · ${r.ms}ms` : `${d.alias} 连接失败：${r.error || ''}`, r.ok);
    }
  } catch (e) {
    STATUS[id] = 'fail';
    if (!silent) toast(e.message, false);
  }
  render();
}

async function testAll() {
  const list = CURRENT_ENV ? dsOf(CURRENT_ENV) : [];
  if (!list.length) return toast('当前环境没有数据源', false);
  toast(`正在测试 ${list.length} 个数据源`);
  for (const d of list) {
    await testDs(d.id, true);
  }
  const ok = list.filter(d => statusOf(d.id) === 'ok').length;
  toast(`${list.length} 个数据源：${ok} 正常 / ${list.length - ok} 异常`, ok === list.length);
}

function openDsModal(id) {
  const isEdit = !!id;
  const cur = CFG.environments.find(e => e.key === CURRENT_ENV) || {};
  const d = isEdit ? dsById(id) : {
    alias: '', env: CURRENT_ENV, driver: 'mysql', host: '', port: 3306,
    user: '', password: '', database: '', readonly: !!cur.readonlyHint
  };
  if (!d) return;

  const envOpts = sortedEnvs().map(e =>
    `<option value="${e.key}" ${e.key === d.env ? 'selected' : ''}>${esc(e.label)}（${e.key}）</option>`
  ).join('');

  showModal(`
    <div class="modal-head">
      <div class="modal-title">${isEdit ? '编辑数据源' : '新增数据源'}</div>
      <div class="modal-sub">${isEdit ? '保存后 MCP 服务自动热加载，无需重启客户端' : '填好连接信息后可先测试再保存'}</div>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label class="label">别名 <span class="opt">AI 与人都用这个名字</span></label>
          <input type="text" id="f-alias" class="mono" value="${esc(d.alias)}" placeholder="order-test">
        </div>
        <div class="field">
          <label class="label">环境</label>
          <select id="f-env" onchange="syncReadonly()">${envOpts}</select>
        </div>
      </div>

      <div class="field-row">
        <div class="field" style="flex:0 0 108px">
          <label class="label">驱动</label>
          <select id="f-driver">
            <option value="mysql" selected>MySQL</option>
          </select>
        </div>
        <div class="field" style="flex:1">
          <label class="label">主机</label>
          <input type="text" id="f-host" class="mono" value="${esc(d.host)}" placeholder="10.20.3.11">
        </div>
        <div class="field" style="flex:0 0 96px">
          <label class="label">端口</label>
          <input type="number" id="f-port" class="mono" value="${d.port}">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label class="label">用户名</label>
          <input type="text" id="f-user" class="mono" value="${esc(d.user)}">
        </div>
        <div class="field">
          <label class="label">密码 <span class="opt">${isEdit ? '留空不改' : '可填 ${变量名}'}</span></label>
          <input type="password" id="f-password" class="mono" value="" placeholder="${isEdit ? esc(d.password) : '${DB_PWD}'}">
        </div>
      </div>

      <div class="field">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <label class="label" style="margin-bottom:0">数据库名 <span class="opt">可选</span></label>
          <button class="btn tiny ghost" onclick="loadDatabases('${isEdit ? d.id : ''}')">加载库列表</button>
        </div>
        <input type="text" id="f-database" class="mono" list="db-list" value="${esc(d.database)}" placeholder="留空 = 不限定库" style="margin-top:8px">
        <datalist id="db-list"></datalist>
        <div class="hint" id="db-hint">留空则不绑定具体库，查询时用 <code class="mono">库名.表名</code> 跨库访问</div>
      </div>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer">
          <input type="checkbox" id="f-readonly" ${d.readonly ? 'checked' : ''} style="width:15px;height:15px">
          只读数据源（execute 会被拒绝）
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveDs('${isEdit ? d.id : ''}')">保存</button>
    </div>
  `);
}

function syncReadonly() {
  const key = $('f-env').value;
  const e = CFG.environments.find(x => x.key === key);
  if (e) $('f-readonly').checked = !!e.readonlyHint;
}

async function loadDatabases(dsId) {
  const hint = $('db-hint');
  hint.textContent = '正在连接…';
  const body = dsId ? { datasource_id: dsId } : {
    host: $('f-host').value.trim(),
    port: parseInt($('f-port').value, 10) || 3306,
    user: $('f-user').value.trim(),
    password: $('f-password').value
  };
  try {
    const r = await api('POST', '/api/probe', body);
    if (!r.ok) {
      hint.textContent = '连接失败：' + (r.error || '');
      return;
    }
    $('db-list').innerHTML = r.databases.map(n => `<option value="${esc(n)}"></option>`).join('');
    hint.textContent = `找到 ${r.databases.length} 个库 · ${r.ms}ms，点击输入框选择`;
    $('f-database').focus();
  } catch (e) {
    hint.textContent = e.message;
  }
}

async function saveDs(id) {
  const alias = $('f-alias').value.trim();
  const host = $('f-host').value.trim();
  const database = $('f-database').value.trim();
  if (!alias) return toast('别名不能为空', false);
  if (!host) return toast('主机不能为空', false);

  const pwd = $('f-password').value;
  const body = {
    alias,
    env: $('f-env').value,
    driver: 'mysql',
    host,
    port: parseInt($('f-port').value, 10) || 3306,
    user: $('f-user').value.trim(),
    database,
    readonly: $('f-readonly').checked
  };
  if (!id || pwd) body.password = pwd;

  const ok = await send(id ? 'PUT' : 'POST', id ? `/api/datasources/${id}` : '/api/datasources', body);
  if (!ok) return;
  closeModal();
  render();
  toast('已保存 ' + alias);
}

function askDeleteDs(id) {
  const d = dsById(id);
  const users = CFG.projects.filter(p => Object.values(p.bindings || {}).includes(id));
  showModal(`
    <div class="modal-head"><div class="modal-title">删除数据源</div></div>
    <div class="modal-body">
      ${users.length
        ? `<div class="warn-box">「${esc(d.alias)}」正被 ${users.length} 个项目引用：${users.map(p => esc(p.name)).join('、')}。请先在项目映射中解除绑定。</div>`
        : `<p style="font-size:14px;color:var(--text-2);line-height:1.6">确定删除数据源 <b style="color:#fff">${esc(d.alias)}</b> 吗？此操作不可撤销。</p>`}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      ${users.length ? '' : `<button class="btn danger" onclick="doDeleteDs('${id}')">确认删除</button>`}
    </div>
  `);
}

async function doDeleteDs(id) {
  if (!await drop(`/api/datasources/${id}`)) return;
  closeModal();
  render();
  toast('已删除');
}

/* -------------------------------------------------------------- 项目 */

function openProjModal(id) {
  const isEdit = !!id;
  const p = isEdit ? CFG.projects.find(x => x.id === id) : {
    id: '', name: '', aliases: [], defaultEnv: null, bindings: {}
  };
  if (!p) return;
  editAliases = [...(p.aliases || [])];

  const bindRows = sortedEnvs().map(e => {
    const opts = CFG.datasources.filter(d => d.env === e.key)
      .map(d => `<option value="${d.id}" ${p.bindings[e.key] === d.id ? 'selected' : ''}>${esc(d.alias)}</option>`)
      .join('');
    return `
      <div class="bind-row">
        <span class="bk">${esc(e.label)}</span>
        <select data-env="${e.key}" onchange="refreshDefaultEnv()">
          <option value="">未绑定</option>${opts}
        </select>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-head">
      <div class="modal-title">${isEdit ? '编辑项目' : '新增项目'}</div>
      <div class="modal-sub">项目名和别名都会被 AI 用来匹配</div>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label">项目名</label>
        <input type="text" id="p-name" value="${esc(p.name)}" placeholder="订单服务">
      </div>

      <div class="field">
        <label class="label">别名 <span class="opt">回车添加，AI 会用它们匹配</span></label>
        <div class="chips" id="p-chips" onclick="$('p-alias-input').focus()">
          <input type="text" id="p-alias-input" placeholder="输入后回车添加" onkeydown="aliasKey(event)">
        </div>
      </div>

      <div class="field">
        <label class="label">默认环境 <span class="opt">AI 未指定环境时使用</span></label>
        <select id="p-defenv"></select>
        <div class="hint" id="defenv-hint"></div>
      </div>

      <div class="divider"></div>

      <div class="group-label">
        <b>环境绑定</b>
        <span>随环境管理动态生成 · 选项按环境过滤</span>
      </div>
      ${bindRows}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveProj('${isEdit ? p.id : ''}')">保存</button>
    </div>
  `, true);

  renderAliasChips();
  refreshDefaultEnv(p.defaultEnv);
}

function renderAliasChips() {
  const box = $('p-chips');
  if (!box) return;
  const input = $('p-alias-input');
  box.querySelectorAll('.chip').forEach(n => n.remove());
  editAliases.forEach((a, i) => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.innerHTML = `${esc(a)}<span class="x" onclick="removeAlias(${i});event.stopPropagation()">×</span>`;
    box.insertBefore(el, input);
  });
}

function aliasKey(ev) {
  if (ev.key === 'Enter' || ev.key === ',') {
    ev.preventDefault();
    const v = ev.target.value.trim().replace(/,$/, '');
    if (!v) return;
    if (editAliases.includes(v)) { ev.target.value = ''; return toast('别名重复', false); }
    editAliases.push(v);
    ev.target.value = '';
    renderAliasChips();
  } else if (ev.key === 'Backspace' && ev.target.value === '' && editAliases.length) {
    editAliases.pop();
    renderAliasChips();
  }
}

function removeAlias(i) {
  editAliases.splice(i, 1);
  renderAliasChips();
}

function refreshDefaultEnv(initVal) {
  const sel = $('p-defenv');
  const hint = $('defenv-hint');
  if (!sel) return;

  const bound = [];
  document.querySelectorAll('#modal-root select[data-env]').forEach(s => {
    if (s.value) bound.push(s.dataset.env);
  });
  const prev = initVal !== undefined ? initVal : sel.value;

  if (bound.length === 0) {
    sel.innerHTML = '<option value="">—</option>';
    sel.disabled = true;
    hint.textContent = '至少绑定一个环境，否则这个项目查不到任何库';
  } else if (bound.length === 1) {
    sel.innerHTML = `<option value="${bound[0]}">${esc(envLabel(bound[0]))}</option>`;
    sel.disabled = true;
    hint.textContent = '只绑定了一个环境，AI 不指定环境时自动用它';
  } else {
    sel.disabled = false;
    const pick = bound.includes(prev) ? prev : bound[0];
    sel.innerHTML = bound.map(k =>
      `<option value="${k}" ${k === pick ? 'selected' : ''}>${esc(envLabel(k))}</option>`
    ).join('');
    hint.textContent = `绑定了 ${bound.length} 个环境，需要指定 AI 默认查哪个`;
  }
}

async function saveProj(id) {
  const name = $('p-name').value.trim();
  if (!name) return toast('项目名不能为空', false);

  const bindings = {};
  document.querySelectorAll('#modal-root select[data-env]').forEach(s => {
    if (s.value) bindings[s.dataset.env] = s.value;
  });
  const keys = Object.keys(bindings);
  if (!keys.length) return toast('至少绑定一个环境，否则这个项目查不到任何库', false);

  const body = {
    name,
    aliases: [...editAliases],
    bindings,
    defaultEnv: keys.length === 1 ? keys[0] : ($('p-defenv').value || keys[0])
  };

  const ok = await send(id ? 'PUT' : 'POST', id ? `/api/projects/${id}` : '/api/projects', body);
  if (!ok) return;
  closeModal();
  render();
  toast('已保存 ' + name);
}

function askDeleteProj(id) {
  const p = CFG.projects.find(x => x.id === id);
  showModal(`
    <div class="modal-head"><div class="modal-title">删除项目</div></div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--text-2);line-height:1.6">确定删除项目 <b style="color:#fff">${esc(p.name)}</b> 吗？只删映射关系，不影响数据源。</p>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn danger" onclick="doDeleteProj('${id}')">确认删除</button>
    </div>
  `);
}

async function doDeleteProj(id) {
  if (!await drop(`/api/projects/${id}`)) return;
  closeModal();
  render();
  toast('已删除');
}

/* -------------------------------------------------------------- 环境 */

function openEnvModal() {
  const list = sortedEnvs();
  const rows = list.map((e, i) => `
    <div class="env-row">
      <span class="env-key mono">${esc(e.key)}</span>
      <input type="text" value="${esc(e.label)}" onchange="envRename('${e.key}', this.value)">
      <label class="ro-label">
        <input type="checkbox" ${e.readonlyHint ? 'checked' : ''} onchange="envToggleRO('${e.key}', this.checked)">
        默认只读
      </label>
      <button class="btn tiny ghost" onclick="envMove('${e.key}',-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="btn tiny ghost" onclick="envMove('${e.key}',1)" ${i === list.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="btn tiny ghost danger" onclick="envDelete('${e.key}')">删除</button>
    </div>
  `).join('');

  showModal(`
    <div class="modal-head">
      <div class="modal-title">管理环境</div>
      <div class="modal-sub">环境可自由增删改，key 建好后不可修改</div>
    </div>
    <div class="modal-body">
      ${rows}
      <div class="divider"></div>
      <div class="group-label"><b>新增环境</b><span>例如：灰度、沙箱、演示</span></div>
      <div style="display:flex;gap:8px">
        <input type="text" id="new-env-key" placeholder="key" class="mono" style="flex:0 0 120px">
        <input type="text" id="new-env-label" placeholder="显示名，如 灰度" style="flex:1">
        <button class="btn primary" onclick="envAdd()">添加</button>
      </div>
      <div class="hint">key 只允许小写字母、数字、下划线，用于配置文件引用，建好后不可修改</div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" onclick="closeModal()">完成</button>
    </div>
  `, true);
}

async function envRename(key, label) {
  if (!label.trim()) return;
  await send('PUT', `/api/environments/${key}`, { label: label.trim() });
  openEnvModal();
  render();
}

async function envToggleRO(key, val) {
  await send('PUT', `/api/environments/${key}`, { readonlyHint: val });
  render();
}

async function envMove(key, dir) {
  const list = sortedEnvs();
  const i = list.findIndex(e => e.key === key);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const keys = list.map(e => e.key);
  [keys[i], keys[j]] = [keys[j], keys[i]];
  await send('POST', '/api/environments/reorder', { keys });
  openEnvModal();
  render();
}

async function envAdd() {
  const key = $('new-env-key').value.trim();
  const label = $('new-env-label').value.trim();
  if (!key || !label) return toast('key 和显示名都要填', false);
  const ok = await send('POST', '/api/environments', { key, label });
  if (!ok) return;
  openEnvModal();
  render();
  toast('已添加环境 ' + label);
}

async function envDelete(key) {
  const ok = await drop(`/api/environments/${key}`);
  if (!ok) return;
  openEnvModal();
  render();
  toast('已删除环境');
}

  $('app').innerHTML = `<div class="empty">加载配置失败：${esc(e.message)}<br>请确认服务是否在运行</div>`;
});
